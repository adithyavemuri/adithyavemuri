<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">From atmospheric simulation to wind-energy insight</title>
  <desc id="description">A scientific workflow schematic. A case TOML defines dates, domains and physics. wrf-era5-case prepares ERA5 forcing and geographical inputs. wrf-autocompiler provides the WRF and WPS build for simulation. WRF_tools analyses output and produces figures, reports and interactive views. A separate inflow workflow requires suitable WRF-LES velocity data for TurbSim and OpenFAST. The illustrated geometry and profile are schematic, not simulation results.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="ocean" x2="1" y2="1">
      <stop stop-color="#edf5fa"/>
      <stop offset="1" stop-color="#dcebf5"/>
    </linearGradient>
    <linearGradient id="volume" x2="0" y2="1">
      <stop stop-color="#dcecf6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8f4f1" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="map-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8cabbf" stroke-width="0.8" opacity="0.34"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#648194" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="map-clip"><path d="M70 242L309 221L367 361L112 393Z"/></clipPath>
    <style>
      text { font-family: 'DejaVu Sans', Arial, sans-serif; fill: #182f45; }
      .muted { fill: #526b7d; }
      .stage { font-size: 23px; font-weight: 600; }
      .number { font-size: 16px; font-weight: 700; fill: #217b84; letter-spacing: 2px; }
      .detail { font-size: 17px; fill: #526b7d; }
      .repo { font-size: 21px; font-family: 'DejaVu Sans Mono', monospace; fill: #246277; }
      .axis { fill: none; stroke: #8197a8; stroke-width: 1.4; }
      .link { fill: none; stroke: #648194; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <path fill="url(#paper)" d="M0 0H1200V720H0Z"/>
  <path fill="#217b84" d="M48 35H88V39H48Z"/>
  <text x="48" y="80" font-size="31" font-weight="600">From atmospheric simulation to wind-energy insight</text>
  <text x="48" y="112" font-size="18" class="muted">Reproducible workflows. Inspectable physics. Reusable scientific analysis.</text>

